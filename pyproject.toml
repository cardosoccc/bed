[project]
name = "bed"
version = "0.1.0"
description = "Portfolio management CLI tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tabulate>=0.9",
    "boto3>=1.34",
    "google-cloud-storage>=2.14",
    "yfinance>=0.2",
    "openpyxl>=3.1.5",
]

[project.scripts]
bed = "bed.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: integration tests using CLI runner",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
